variables:
  GIT_SUBMODULE_STRATEGY: recursive

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

# Fast gradle build using Java 17 + Android SDK
gradle build:
  stage: build
  image: eclipse-temurin:17-jdk
  variables:
    ANDROID_SDK_ROOT: /opt/android-sdk
    ANDROID_HOME: /opt/android-sdk
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget unzip > /dev/null
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
    - mkdir -p ${ANDROID_SDK_ROOT}/cmdline-tools
    - unzip -q /tmp/cmdline-tools.zip -d ${ANDROID_SDK_ROOT}/cmdline-tools
    - mv ${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools ${ANDROID_SDK_ROOT}/cmdline-tools/latest
    # accept all SDK licenses
    - mkdir -p ${ANDROID_SDK_ROOT}/licenses
    - printf 'y\ny\ny\ny\ny\ny\n' | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
    - ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" 2>/dev/null
  script:
    - ./gradlew assembleDebug --no-daemon
  artifacts:
    paths:
      - build/outputs/apk/
    when: always

fdroid build:
  stage: build
  image: registry.gitlab.com/mvglasow/ci-images-server:latest
  allow_failure: true
  artifacts:
    # name: "${CI_PROJECT_PATH}_${CI_JOB_STAGE}_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHA}"
    paths:
      - signed/
      - unsigned/
    when: always
    # expire_in: 1 month
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .android
      - .gradle
  script:
    # each `fdroid build --on-server` run expects sudo, then uninstalls it
    - set -x
    - apt-get install sudo
    # patch the ancient F-Droid server to accept Gradle 8.9
    # (its GRADLE_SHA256 dict predates Gradle 8.x)
    - |
      FDROID_GRADLE=$(find /fdroidserver /usr/lib/python* /usr/local/lib/python* -name "gradle.py" -path "*/fdroidserver/*" 2>/dev/null | head -1)
      if [ -n "$FDROID_GRADLE" ]; then
        echo "Patching F-Droid server: $FDROID_GRADLE"
        sed -i "/No hash for gradle version/{n;s/.*/        pass  # gradle hash check disabled for CI/}" "$FDROID_GRADLE"
      fi
    # TODO not sure if we need that for this app
    # - fdroid fetchsrclibs --verbose
    # this builds the latest version of the app from its source dir, using the build recipe in .fdroid.yml
    - fdroid build --verbose --on-server --no-tarball
    # create a keystore if we don’t have one
    - ls .android || mkdir .android
    - ls .android/debug.keystore || keytool -genkey -v -keystore .android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
    # sign the apk
    - cp -R unsigned signed
    - jarsigner -verbose -keystore .android/debug.keystore -storepass android -keypass android signed/*.apk androiddebugkey

# GitLab Pages

pages:
  stage: deploy
  script:
  - echo 'Nothing to do...'
  artifacts:
    paths:
    - public
  only:
  - master@mvglasow/satstat
