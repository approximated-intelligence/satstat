variables:
  GIT_SUBMODULE_STRATEGY: recursive

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

# Fast gradle build using Java 17 + Android SDK
gradle build:
  stage: build
  image: eclipse-temurin:17-jdk
  variables:
    ANDROID_SDK_ROOT: /opt/android-sdk
    ANDROID_HOME: /opt/android-sdk
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget unzip > /dev/null
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
    - mkdir -p ${ANDROID_SDK_ROOT}/cmdline-tools
    - unzip -q /tmp/cmdline-tools.zip -d ${ANDROID_SDK_ROOT}/cmdline-tools
    - mv ${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools ${ANDROID_SDK_ROOT}/cmdline-tools/latest
    # accept all SDK licenses
    - mkdir -p ${ANDROID_SDK_ROOT}/licenses
    - printf 'y\ny\ny\ny\ny\ny\n' | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
    - ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" 2>/dev/null
  script:
    - ./gradlew assembleDebug --no-daemon
  artifacts:
    paths:
      - build/outputs/apk/
    when: always

fdroid build:
  stage: build
  image: eclipse-temurin:17-jdk
  allow_failure: true
  artifacts:
    paths:
      - signed/
      - unsigned/
    when: always
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .android
      - .gradle
  variables:
    ANDROID_HOME: /opt/android-sdk
  before_script:
    - set -x
    # install dependencies
    - apt-get update -qq && apt-get install -y -qq wget unzip python3 python3-pip > /dev/null 2>&1
    # install fdroidserver
    - pip3 install --break-system-packages fdroidserver 2>/dev/null || pip3 install fdroidserver
    # install Android SDK cmdline tools
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
    - mkdir -p ${ANDROID_HOME}/cmdline-tools
    - unzip -q /tmp/cmdline-tools.zip -d ${ANDROID_HOME}/cmdline-tools
    - mv ${ANDROID_HOME}/cmdline-tools/cmdline-tools ${ANDROID_HOME}/cmdline-tools/latest
    # accept SDK licenses
    - mkdir -p ${ANDROID_HOME}/licenses
    - printf 'y\ny\ny\ny\ny\ny\n' | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
    - ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" 2>/dev/null
  script:
    - fdroid build --verbose --no-tarball
    # create a keystore if we don't have one
    - ls .android || mkdir .android
    - ls .android/debug.keystore || keytool -genkey -v -keystore .android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
    # sign the apk
    - cp -R unsigned signed
    - jarsigner -verbose -keystore .android/debug.keystore -storepass android -keypass android signed/*.apk androiddebugkey

# GitLab Pages

pages:
  stage: deploy
  script:
  - echo 'Nothing to do...'
  artifacts:
    paths:
    - public
  only:
  - master@mvglasow/satstat
